      /**
       * Renderiza um quadro da corrida; useFlip anima reposicionamento vertical (FLIP).
       */
      function renderBarRaceFrame(p, frameIndex, useFlip) {
        const stage = document.getElementById(`race-stage-${p.id}`);
        const hourEl = document.getElementById(`race-hour-${p.id}`);
        const frames = getBarRaceFrames(p);
        if (!stage || !hourEl) return;

        if (!frames.length) {
          hourEl.textContent = "Sem dados de tempo.";
          stage.innerHTML = `<p class="chart-subhint">Não há horários para reproduzir neste plantão.</p>`;
          syncRacePlayButton(p);
          return;
        }

        const idx = Math.max(0, Math.min(frameIndex, frames.length - 1));
        state.raceFrame[p.id] = idx;

        const frame = frames[idx];
        const maxRace = getBarRaceMaxPontosFinal(p);
        const palette = p.barRaceCorPorMedico || {};

        hourEl.textContent = `Momento — ${frame.hour} · Quadro ${idx + 1} de ${frames.length}`;

        const oldRects = new Map();
        if (useFlip) {
          stage.querySelectorAll(".race-row[data-med]").forEach((el) => {
            oldRects.set(el.dataset.med, el.getBoundingClientRect());
          });
        }

        const html = frame.rows
          .map((row, rank) => {
            const pts = row.pontos || 0;
            const widthPct = Math.max(0, Math.min(100, (pts / maxRace) * 100));
            const paletteKeys = Object.keys(palette);
            const colorIdx = paletteKeys.indexOf(row.medico);
            const bg =
              palette[row.medico] ||
              raceBarGradientForColor(
                doctorColorByIndex(colorIdx >= 0 ? colorIdx : rank),
              );
            const medEsc = escHtmlAttr(row.medico);
            return `<div class="race-row" data-med="${medEsc}" data-rank="${rank}">
        <span class="race-label" title="${medEsc}">${escHtmlAttr(row.medico)}</span>
        <div class="race-bar-wrap"><div class="race-bar" style="width:${widthPct}%;background:${bg}"></div></div>
        <span class="race-value">${formatNumber(pts)}</span>
      </div>`;
          })
          .join("");

        stage.innerHTML = html;

        if (useFlip && oldRects.size) {
          requestAnimationFrame(() => {
            stage.querySelectorAll(".race-row[data-med]").forEach((el) => {
              const id = el.dataset.med;
              const prev = oldRects.get(id);
              if (!prev) return;
              const next = el.getBoundingClientRect();
              const dy = prev.top - next.top;
              if (Math.abs(dy) < 0.55) return;
              el.style.transition = "none";
              el.style.transform = `translateY(${dy}px)`;
              requestAnimationFrame(() => {
                el.style.transition =
                  "transform 0.52s cubic-bezier(0.22, 1, 0.36, 1)";
                el.style.transform = "translateY(0)";
              });
              el.addEventListener(
                "transitionend",
                (ev) => {
                  if (ev.propertyName !== "transform") return;
                  el.style.transition = "";
                  el.style.transform = "";
                },
                { once: true },
              );
            });
          });
        }

        syncRacePlayButton(p);
      }

      function playBarRace(p) {
        const frames = getBarRaceFrames(p);
        if (!frames.length) return;

        stopRaceTimer(p.id);
        state.racePlayingId = p.id;

        let idx = 0;
        renderBarRaceFrame(p, idx, false);

        if (frames.length <= 1) {
          state.racePlayingId = null;
          syncRacePlayButton(p);
          return;
        }

        state.raceTimers[p.id] = setInterval(() => {
          idx += 1;
          if (idx >= frames.length) {
            stopRaceTimer(p.id);
            if (state.racePlayingId === p.id) state.racePlayingId = null;
            state.raceFrame[p.id] = frames.length - 1;
            renderBarRaceFrame(p, state.raceFrame[p.id], false);
            return;
          }
          renderBarRaceFrame(p, idx, true);
        }, 180);
      }

      function wirePlantaoMainDelegatesOnce() {
        if (plantaoMainDelegatesWired) return;
        plantaoMainDelegatesWired = true;
        el.plantaoMain.addEventListener("click", (e) => {
          const raceBtn = e.target.closest(".race-play");
          if (raceBtn) {
            const pid = raceBtn.dataset.id;
            const pMatch = state.plantoes.find((x) => x.id === pid);
            if (pMatch) playBarRace(pMatch);
            return;
          }

          const tipoBtn = e.target.closest(".hourly-atend-tipo");
          if (tipoBtn) {
            const tipo = tipoBtn.dataset.tipo;
            if (!tipo || tipo === state.hourlyAtendTipo) return;
            state.hourlyAtendTipo = tipo;
            syncHourlyAtendTipoButtons();
            const pTipo = state.plantoes.find((x) => x.id === state.selectedId);
            if (pTipo) renderPlantaoChart(pTipo);
            return;
          }

          const btn = e.target.closest(".hourly-atend-mode");
          if (!btn) return;
          const mode = btn.dataset.mode;
          if (!mode || mode === state.hourlyAtendMode) return;
          state.hourlyAtendMode = mode;
          syncHourlyAtendModeButtons();
          syncHourlyAtendTipoButtons();
          const p = state.plantoes.find((x) => x.id === state.selectedId);
          if (p) renderPlantaoChart(p);
        });
      }

      function renderPlantaoNav() {
        const hojeISO = toISODateLocal(new Date());
        const grupos = agruparPlantoesPorData(state.plantoes);
        el.plantaoNav.innerHTML = agruparPlantoesPorSemana(grupos)
          .map((dias) =>
            dias
              .map((col) => {
                if (!col) {
                  return `<div class="plantao-chip-empty" aria-hidden="true"></div>`;
                }
                const isToday = col.dataISO === hojeISO;
                return `
    <div class="plantao-chip${isToday ? " is-today" : ""}">
      <div class="plantao-chip-header">
        <span class="plantao-chip-weekday">${diaSemanaAbrev(col.diaSemana)}</span>
        <span class="plantao-chip-date">${fmtDataAno2(col.data)}</span>
        ${isToday ? `<span class="plantao-chip-today-badge">hoje</span>` : ""}
      </div>
      <div class="plantao-chip-body">
        ${plantaoChipHalfHtml(col.diurno, "diurno")}
        ${plantaoChipHalfHtml(col.noturno, "noturno")}
      </div>
    </div>
  `;
              })
              .join(""),
          )
          .join("");
        el.plantaoNav
          .querySelectorAll(".plantao-chip-half:not(.placeholder)")
          .forEach((btn) => {
            btn.addEventListener("click", () => selectPlantao(btn.dataset.id));
          });
      }

      function renderPlantaoViews() {
        el.plantaoViews.innerHTML = plantoesParaExibicao()
          .map(
            (p) => `
    <section class="plantao-view${p.id === state.selectedId ? " active" : ""}" id="view-${p.id}" data-id="${p.id}" role="tabpanel">
      <div class="kpis-plantao-wrap">
        <section class="kpis kpis-plantao kpis-row-main" id="kpis-main-${p.id}"></section>
        <section class="kpis kpis-plantao kpis-row-risco" id="kpis-risco-${p.id}"></section>
      </div>
      <div class="table-wrap glass" style="padding:0">
        <table id="table-${p.id}">
          <thead><tr>${TABLE_COLUMNS.map(([key, label]) => `<th data-sort="${key}">${label}</th>`).join("")}</tr></thead>
          <tbody id="tbody-${p.id}"></tbody>
        </table>
      </div>
      <article class="chart-card glass hourly-chart">
        <div class="chart-card-head">
          <h3>Atendimentos por horário (por médico)</h3>
          <div class="chart-switches-col">
            <div class="chart-switch-wrap" aria-label="Tipo do gráfico de atendimentos">
              <span class="chart-switch-label">Tipo</span>
              <div class="chart-switch" role="group">
                <button type="button" class="chart-switch-btn hourly-atend-tipo" data-tipo="pacientes">Pacientes</button>
                <button type="button" class="chart-switch-btn hourly-atend-tipo" data-tipo="pontos">Pontos</button>
              </div>
            </div>
            <div class="chart-switch-wrap" aria-label="Modo do gráfico de atendimentos">
              <span class="chart-switch-label">Modo</span>
              <div class="chart-switch" role="group">
                <button type="button" class="chart-switch-btn hourly-atend-mode" data-mode="absoluto">Absoluto</button>
                <button type="button" class="chart-switch-btn hourly-atend-mode" data-mode="acumulado">Acumulado</button>
              </div>
            </div>
          </div>
        </div>
        <canvas id="chart-${p.id}"></canvas>
      </article>
      <article class="chart-card glass hourly-chart">
        <h3>Tempo de espera para atendimento médico por hora do dia</h3>
        <p class="chart-subhint">Faixa entre menor e maior tempo de espera por hora. Pontos discrepantes são exibidos isoladamente e não deformam a linha superior. Valores acima de 6 horas (360 min) foram excluídos.</p>
        <canvas id="chart-espera-${p.id}"></canvas>
      </article>
      <article class="chart-card glass race-card">
        <div class="chart-card-head">
          <h3>Corrida de pontos por médico</h3>
          <div class="race-controls">
            <button type="button" class="chart-switch-btn race-play" data-id="${p.id}">Reproduzir</button>
          </div>
        </div>
        <p class="chart-subhint">Ranking animado pela pontuação acumulada a cada 10 minutos do plantão (mesma regra da coluna Pontos).</p>
        <div class="race-hour" id="race-hour-${p.id}" aria-live="polite"></div>
        <div class="race-stage" id="race-stage-${p.id}"></div>
      </article>
    </section>
  `,
          )
          .join("");
        el.plantaoViews.querySelectorAll("th[data-sort]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            if (state.sortBy === key)
              state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
            else {
              state.sortBy = key;
              state.sortDir = key === "medico" ? "asc" : "desc";
            }
            renderSelectedPlantao();
          });
        });
        syncHourlyAtendModeButtons();
        syncHourlyAtendTipoButtons();
      }

      function renderPlantaoTable(p) {
        const tbody = document.getElementById(`tbody-${p.id}`);
        if (!tbody) return;
        const rows = [...p.rows].sort((a, b) => {
          const cmp = compareValues(a, b, state.sortBy, state.sortDir);
          if (cmp !== 0 || state.sortBy !== "pontos") return cmp;
          return b.geral - a.geral || b.am - a.am;
        });
        const topPontos = rows.length
          ? rows.reduce((a, b) => (b.pontos > a.pontos ? b : a)).medico
          : null;
        tbody.innerHTML = rows
          .map(
            (r) => `
    <tr class="${r.medico === topPontos ? "highlight" : ""}">
      <td>${r.medico}</td>
      <td>${r.geral}</td>
      <td>${r.ate2}</td>
      <td>${r.ate12}</td>
      <td>${r.maior60}</td>
      <td>${r.maior80}</td>
      <td>${r.am}</td>
      <td>${r.lv}</td>
      <td><strong>${r.pontos}</strong></td>
    </tr>
  `,
          )
          .join("");
      }

      function renderPlantaoKpis(p) {
        const kpiMain = document.getElementById(`kpis-main-${p.id}`);
        const kpiRisco = document.getElementById(`kpis-risco-${p.id}`);
        if (!kpiMain || !kpiRisco) return;
        const k = p.kpis;
        const dificuldade = getDificuldadeAtualizada(p);
        kpiMain.innerHTML = [
          cardTemplate(
            "Total de pacientes",
            k.totalPacientes,
            false,
            "",
            "kpi-card--total",
          ),
          cardTemplate(
            "Tempo médio de espera",
            formatarDuracaoEspera(k.tempoMedioEspera),
            true,
            "* Excluídos os 5 maiores e 5 menores tempos.",
            "kpi-card--espera",
          ),
          indicesCombinedCardTemplate(k.indiceProdutividade, dificuldade.total),
        ].join("");
        kpiRisco.innerHTML = CORES_RISCO.map((cor) => {
          const d = k.risco?.[cor] || { total: 0, mediaEspera: null };
          return riskCardTemplate(cor, d.total, d.mediaEspera);
        }).join("");
      }

      function renderPlantaoChart(p) {
        const chartKey = (suffix) => `chart:${p.id}:${suffix}`;

        function destroyChart(suffix) {
          const key = chartKey(suffix);
          if (state.charts[key]) {
            state.charts[key].destroy();
            delete state.charts[key];
          }
        }

        destroyChart("atend");
        destroyChart("espera");

        const canvasAtend = document.getElementById(`chart-${p.id}`);
        if (canvasAtend) {
          const atendData = prepareAtendimentosPorHoraChartData(
            hourlyChartBaseData(p),
          );
          const yTitle = hourlyChartYTitle();
          const atendOpts = chartBaseOptions();
          atendOpts.plugins.tooltip = { enabled: false };
          atendOpts.scales.x.title = {
            ...atendOpts.scales.x.title,
            text: "Horário",
          };
          atendOpts.scales.y.title = {
            ...atendOpts.scales.y.title,
            text: yTitle,
          };
          atendOpts.scales.y.max = atendimentosYScaleMax(atendData.datasets);
          atendOpts.scales.y.ticks = {
            ...atendOpts.scales.y.ticks,
            stepSize: 2,
          };
          atendOpts.animation = { duration: 200 };
          atendOpts.hover = { mode: "nearest", intersect: false, axis: "xy" };
          let atendHoverIndex = null;
          const ATEND_HOVER_MAX_DIST = 24;
          atendOpts.onHover = (event, _elements, chart) => {
            const xScale = chart.scales.x;
            const yScale = chart.scales.y;
            const pos =
              event.type === "mouseout"
                ? null
                : Chart.helpers.getRelativePosition(event, chart);
            const dentroDaArea =
              pos &&
              pos.x >= xScale.left &&
              pos.x <= xScale.right &&
              pos.y >= yScale.top &&
              pos.y <= yScale.bottom;

            let idx = null;
            if (dentroDaArea) {
              let nearestLabelIndex = 0;
              let minXDist = Infinity;
              chart.data.labels.forEach((_, i) => {
                const dist = Math.abs(xScale.getPixelForValue(i) - pos.x);
                if (dist < minXDist) {
                  minXDist = dist;
                  nearestLabelIndex = i;
                }
              });

              let bestIdx = null;
              let bestDist = Infinity;
              chart.data.datasets.forEach((ds, i) => {
                if (!ds._baseColor) return;
                const val = valorNumericoPontoGrafico(
                  ds.data?.[nearestLabelIndex],
                );
                if (val == null) return;
                const dist = Math.abs(yScale.getPixelForValue(val) - pos.y);
                if (dist < bestDist) {
                  bestDist = dist;
                  bestIdx = i;
                }
              });

              if (bestDist <= ATEND_HOVER_MAX_DIST) idx = bestIdx;
            }

            if (idx === atendHoverIndex) return;
            atendHoverIndex = idx;
            applyDatasetHoverHighlight(chart, idx);
          };
          state.charts[chartKey("atend")] = new Chart(canvasAtend, {
            type: "line",
            data: atendData,
            options: atendOpts,
          });
        }

        const canvasEsp = document.getElementById(`chart-espera-${p.id}`);
        if (!canvasEsp) return;

        const esperaOpts = chartBaseOptions();
        const esperaData = p.chartEsperaPorHora || { labels: [], datasets: [] };

        esperaOpts.plugins.legend.labels.filter = (item) =>
          !String(item.text).includes("__min");
        esperaOpts.plugins.tooltip.callbacks = {
          title(items) {
            const idx = items?.[0]?.dataIndex;
            return esperaData.labels?.[idx] ?? "";
          },
          label(ctx) {
            if (String(ctx.dataset.label).includes("__min")) return null;
            const y = valorNumericoPontoGrafico(ctx.raw);
            if (y == null) return null;
            const cor = String(ctx.dataset.label);
            if (cor.includes("ponto discrepante")) {
              return `${cor}: ${formatNumber(y)} min`;
            }
            const idx = ctx.dataIndex;
            const minDs = ctx.chart.data.datasets[ctx.datasetIndex + 1];
            const minVal = minDs?.data?.[idx];
            if (minVal != null && !Number.isNaN(minVal)) {
              return `${cor}: ${formatNumber(minVal)} – ${formatNumber(y)} min`;
            }
            return `${cor} (máx.): ${formatNumber(y)} min`;
          },
        };
        esperaOpts.scales.x.title = {
          ...esperaOpts.scales.x.title,
          text: "Horário (início do atendimento médico)",
        };
        esperaOpts.scales.y.title = {
          ...esperaOpts.scales.y.title,
          text: "Tempo de espera",
        };
        esperaOpts.scales.y.max = esperaYScaleMax(esperaData.datasets);
        esperaOpts.scales.y.ticks = {
          ...esperaOpts.scales.y.ticks,
          stepSize: 20,
          callback: (value) => formatEsperaEixoMinutos(value),
        };

        state.charts[chartKey("espera")] = new Chart(canvasEsp, {
          type: "line",
          data: esperaData,
          options: esperaOpts,
        });
      }

      function selectPlantao(id) {
        if (!state.plantoes.some((p) => p.id === id)) return;
        stopAllRaceTimers();
        syncAllRacePlayButtons();
        state.selectedId = id;
        el.plantaoNav.querySelectorAll(".plantao-chip-half").forEach((btn) => {
          const active = btn.dataset.id === id;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        el.plantaoViews.querySelectorAll(".plantao-view").forEach((view) => {
          view.classList.toggle("active", view.dataset.id === id);
        });
        renderSelectedPlantao();
      }

      function renderSelectedPlantao() {
        const p = state.plantoes.find((x) => x.id === state.selectedId);
        if (!p) return;
        renderPlantaoKpis(p);
        renderPlantaoTable(p);
        renderBarRaceFrame(p, state.raceFrame[p.id] ?? 0, false);
        renderPlantaoChart(p);
        renderIndicadoresFooter(p);
      }

      function setUploadError(message) {
        el.uploadError.hidden = !message;
        el.uploadError.textContent = message || "";
      }

      function showUploadGate(open) {
        el.uploadOverlay.hidden = !open;
        el.uploadOverlay.setAttribute("aria-hidden", open ? "false" : "true");
        if (open) {
          setUploadError("");
        }
        if (el.indicadoresFooter) el.indicadoresFooter.hidden = open;
      }

      async function bootstrapWithPayload(payload) {
        stopAllRaceTimers();
        state.raceFrame = {};
        state.raw = payload;
        state.plantoes = payload.data.plantoes || [];
        state.selectedId =
          state.plantoes[state.plantoes.length - 1]?.id ?? null;
        state.charts = {};

        if (!state.plantoes.length) {
          setUploadError("Nenhum plantão encontrado na planilha.");
          showUploadGate(true);
          if (el.indicadoresFooter) el.indicadoresFooter.hidden = true;
          return;
        }

        renderPlantaoViews();
        renderPlantaoNav();
        el.plantaoNavWrap.hidden = false;
        el.plantaoMain.hidden = false;
        selectPlantao(state.selectedId);

        if (!dashboardControlsWired) {
          el.changeSheetBtn.addEventListener("click", () =>
            showUploadGate(true),
          );
          dashboardControlsWired = true;
        }
        el.changeSheetBtn.hidden = false;
        el.app.classList.remove("loading");
      }

      function setUploadProcessing(processing) {
        el.uploadProgress.hidden = !processing;
        el.uploadDropText.textContent = processing
          ? "Aguarde…"
          : "Clique ou arraste o arquivo aqui";
        el.fileInput.disabled = processing;
      }

      async function executarAnalise(file) {
        if (!file) {
          setUploadError("Escolha um arquivo .xls ou .xlsx.");
          return;
        }
        const ext = file.name.toLowerCase();
        if (!ext.endsWith(".xls") && !ext.endsWith(".xlsx")) {
          setUploadError("Formato não suportado. Use .xls ou .xlsx.");
          return;
        }
        setUploadError("");
        setUploadProcessing(true);
        try {
          state.lastFile = file;
          const payload = await processarArquivo(file);
          showUploadGate(false);
          el.fileInput.value = "";
          await bootstrapWithPayload(payload);
        } catch (err) {
          setUploadError(err.message || String(err));
        } finally {
          setUploadProcessing(false);
        }
      }

      function wireUploadUi() {
        el.uploadForm.addEventListener("submit", (e) => e.preventDefault());

        el.uploadDrop.addEventListener("dragover", (e) => {
          e.preventDefault();
          el.uploadDrop.classList.add("dragover");
        });
        el.uploadDrop.addEventListener("dragleave", () =>
          el.uploadDrop.classList.remove("dragover"),
        );
        el.uploadDrop.addEventListener("drop", (e) => {
          e.preventDefault();
          el.uploadDrop.classList.remove("dragover");
          const f = e.dataTransfer.files[0];
          if (!f) return;
          const dt = new DataTransfer();
          dt.items.add(f);
          el.fileInput.files = dt.files;
          executarAnalise(f);
        });

        el.fileInput.addEventListener("change", () => {
          const file = el.fileInput.files[0];
          if (file) executarAnalise(file);
        });
      }

      function init() {
        wirePlantaoMainDelegatesOnce();
        wireUploadUi();
        showUploadGate(true);
        el.changeSheetBtn.hidden = true;
        el.app.classList.remove("loading");
      }

      init();
    </script>
  </body>
</html>
